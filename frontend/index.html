<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Cartero Invisible</title>
  <link rel="stylesheet" href="./style/style.css">
</head>

<body>

  <header>
    <h1 id="titolPrincipal">El Cartero Invisible</h1>
  </header>

  <main>
    <div class="main-container">

      <marquee>¡Bienvenido al Cartero Invisible!</marquee>
    <!-- Formulari per afegir noves cartes (POST) -->
    <section class="seccio-formulari">
      <h2>Nova Carta</h2>
      <form id="formCarta">
        <input type="text" id="remitent" placeholder="El teu nom" required>
        <input type="text" id="destinatari" placeholder="A qui va dirigida?" required>
        <textarea id="contingut" placeholder="Escriu la teva carta..." required></textarea>
        <input type="text" id="personatge" placeholder="A quin personatge escrius? (ex: Einstein)">
        <button type="submit" id="btnEnviar" class="btn-principal">Enviar carta</button>
      </form>
    </section>
      <!-- Contenidor de Targetes (Vista Taulell) -->
      <div id="contenidorCartes" class="grid-cartes"></div> 

      <div class="accions-globals">
        <button id="btnSaluda" type="button" class="btn-secundari">Saluda'm!</button>
        <button type="button" id="btnMostrarCartes" class="btn-principal">Mostrar cartes</button>
      </div>

    </div>

    <div id="buzon">📭</div>

    <!-- Taula de Cartes -->
    <div class="taula-responsive">
      <table id="taulaCartes">
        <thead>
          <tr>
            <th>ID</th>
            <th>Remitent</th>
            <th>Destinatari</th>
            <th>Contingut</th>
            <th>Accions</th>
          </tr>
        </thead>
        <tbody id="cosTaulaCartes">
          <!-- Es genera dinàmicament -->
        </tbody>
      </table>
    </div>

    <!-- Modal d'Edició (PUT) -->
    <div id="modalEditar" class="modal">
      <div class="modal-contingut">
        <span id="btnTancarModal" class="tancar">&times;</span>
        <h2>Editar Carta</h2>
        <form id="formEditarCarta">
          <!-- ID amagat per no mostrar-lo a l'usuari -->
          <input type="hidden" id="edit-id">

          <label for="edit-remitent">Remitent:</label>
          <input type="text" id="edit-remitent" required>

          <label for="edit-destinatari">Destinatari:</label>
          <input type="text" id="edit-destinatari" required>

          <label for="edit-contingut">Contingut:</label>
          <textarea id="edit-contingut" rows="4" required></textarea>

          <label for="edit-personatge">Personatge:</label>
          <input type="text" id="edit-personatge">

          <button type="submit" class="btn-principal">Guardar Canvis</button>
        </form>
      </div>
    </div>

  </main>

  <footer>
    <p>&copy; 2026 El Cartero Invisible</p>
  </footer>

  <script src="./js/script.js" type="module"></script>
</body>

</html>
