<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Cartero Invisible</title>
  <link rel="stylesheet" href="./style/style.css">
</head>

<body>

  <header>
    <h1 id="titolPrincipal">El Cartero Invisible</h1>
  </header>

  <main>
    <div style="max-width: 800px; margin: 0 auto;">

      <marquee>¡Bienvenido al Cartero Invisible!</marquee>
      
      <!-- Contenidor on es dibuixaran les cartes -->
      <div id="contenidorCartes"></div> 

      <button id="btnSaluda" type="button">Saluda'm!</button>

    </div>

    <div id="buzon">
      📭
    </div>

    <!-- Formulari per afegir noves cartes (Setmana 4 / M06) -->
    <form id="formCarta">
      <input type="text" id="remitent" placeholder="El teu nom" required>
      <input type="text" id="destinatari" placeholder="A qui va dirigida?" required>
      <input type="text" id="personatge" placeholder="El teu personatge favorit" required>
      <textarea id="contingut" placeholder="Escriu la teva carta..." required></textarea>
      <!-- Canviat type="button" per type="submit" -->
      <button type="submit" id="btnEnviar">Enviar carta</button>
    </form>

    <!-- Botó sense onclick directament a l'HTML -->
    <button type="button" id="btnMostrarCartes">Mostrar cartes</button>

    <table id="taulaCartes">
      <thead>
        <tr>
          <th>ID</th>
          <th>Remitent</th>
          <th>Destinatari</th>
          <th>Contingut</th>
          <th>Accions</th>
          <th>Personatge</th>
        </tr>
      </thead>
      <tbody id="cosTaulaCartes">
        <!-- Les cartes s'afegiran aquí dinàmicament -->
      </tbody>
    </table>

  </main>

  <footer>
    <p>&copy; 2026 El Cartero Invisible</p>
  </footer>

  <script src="./js/script.js" type="module"></script>
</body>

</html>
